<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عرض الوسائط</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  #stage{position:fixed;inset:0}
  .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
         opacity:0;transition:opacity 1s ease}
  .slide.active{opacity:1}
  .empty{color:#fff;font:28px system-ui,Tahoma,sans-serif;display:flex;
         height:100vh;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="stage"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== نفس البيانات المستخدمة في لوحة الإدارة ======

const SUPABASE_URL = 'https://uhyynnsodeuqvosobuvf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoeXlubnNvZGV1cXZvc29idXZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNzY0OTAsImV4cCI6MjEwODc1MjQ5MH0.Tvf5pbF7QdONwdIpwhVkBsC-JzVYffCDGNuCPCjUtb0';

// ====================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const IMAGE_SECONDS = 8;     // مدة عرض الصورة بالثواني
const REFRESH_MS = 60000;    // تحديث القائمة كل دقيقة
const stage = document.getElementById('stage');

let playlist = [];
let index = -1;
let timer = null;
let current = null;

async function loadPlaylist(){
  const {data, error} = await sb.from('media').select('*').order('sort_order');
  if(!error && data) playlist = data;
}

function showEmpty(){
  stage.innerHTML = '<div class="empty">لا يوجد محتوى بعد</div>';
  current = null;
}

// تشغيل الفيديو مع الصوت، وإن منع المتصفح الصوت يعود للتشغيل بدون صوت حتى لا يتوقف العرض
function playVideo(el){
  el.muted = false;
  el.volume = 1;
  const p = el.play();
  if(p && p.catch){
    p.catch(() => { el.muted = true; el.play().catch(() => setTimeout(next, 1000)); });
  }
}

function next(){
  clearTimeout(timer);
  if(!playlist.length){
    showEmpty();
    timer = setTimeout(async () => { await loadPlaylist(); next(); }, 5000);
    return;
  }

  index = (index + 1) % playlist.length;

  const m = playlist[index];
  const isVideo = m.type === 'video';
  const el = document.createElement(isVideo ? 'video' : 'img');
  el.className = 'slide';
  el.src = m.url;

  if(isVideo){
    el.playsInline = true;
    el.preload = 'auto';
    el.onended = next;
    el.onerror = () => setTimeout(next, 1000);
    el.oncanplay = () => { if(el.paused) playVideo(el); };
  } else {
    el.onerror = () => setTimeout(next, 1000);
  }

  stage.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('active')));
  if(isVideo) playVideo(el);

  if(current){
    const old = current;
    old.classList.remove('active');
    setTimeout(() => { if(old.pause) old.pause(); old.remove(); }, 1000);
  }
  current = el;

  if(!isVideo) timer = setTimeout(next, IMAGE_SECONDS * 1000);
}

(async () => {
  await loadPlaylist();
  next();
  setInterval(loadPlaylist, REFRESH_MS);
  try { await navigator.wakeLock?.request('screen'); } catch(e){}
})();
</script>
</body>
</html>
